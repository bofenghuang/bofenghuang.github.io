baseURL: https://bofenghuang.github.io/
locale: en-US
title: Bofeng Huang
theme: PaperMod
enableRobotsTXT: true
disableKinds: [taxonomy, term, RSS]

outputs:
  home: [HTML]

params:
  description: Healthcare, conversational AI, and natural language processing.
  author: Bofeng Huang
  defaultTheme: light
  disableThemeToggle: false
  disableScrollToTop: true
  socialIcons:
    - name: github
      title: GitHub
      url: https://github.com/bofenghuang
    - name: huggingface
      title: Hugging Face
      url: https://huggingface.co/bofenghuang
    - name: linkedin
      title: LinkedIn
      url: https://www.linkedin.com/in/bofenghuang/
    - name: x
      title: Twitter / X
      url: https://twitter.com/bofenghuang1
    - name: googlescholar
      title: Google Scholar
      url: https://scholar.google.com/citations?user=-0WpS7UAAAAJ&hl=en


caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    extensions:
      typographer:
        apostrophe: "'"
        leftsinglequote: "'"
        rightsinglequote: "'"
